name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev --extra adapters --extra openenv
      - name: Tests
        # Docker and Ollama are absent here, and that is the point: the suite
        # must skip with a reason rather than fail. Anything that errors is a
        # test that assumed a runtime it never declared.
        run: uv run pytest -q

  the-readme-command-works:
    # A judge followed the README literally, from a clean clone, and got 24
    # environments and assay 0.0 where it claims 28 and 43.0 -- because the
    # quoted command was missing `--extra sweep` and tau2's `toml`. CI never
    # caught it because CI syncs its own extras and never runs what the README
    # says. This job runs the README's literal command and nothing else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fetch the tau2 snapshots the README tells you to fetch
        continue-on-error: true
        run: uv run --extra tau2 python scripts/tau2_fetch.py
      - name: The command the README gives a newcomer
        env:
          ASSAY_APPROVE_ALL: "ci: the readme's own command, .github/workflows/ci.yml"
        # --allow-reduced because this runner genuinely cannot install every
        # provider: `openenv` pulls two git subdirectories and `tau2` needs a
        # snapshot fetch that can fail offline. The refusal that flag lifts is
        # correct and stays on for humans; what this job checks is narrower and
        # is the thing that actually broke.
        run: |
          uv run --extra adapters --extra openenv --extra tau2 --extra sweep \
            python scripts/full_run.py --allow-reduced --out /tmp/readme_run.json
      - name: The extras in the command must reach the providers they name
        run: |
          uv run python - <<'PY'
          import json, sys
          run = json.load(open("/tmp/readme_run.json"))
          committed = json.load(open("results/full_run.json"))
          got = set(run["per_env"])
          want = set(committed["per_env"])

          # The bug this job exists for: the documented command omitted
          # `--extra sweep`, so the two inspect_evals environments -- including
          # `boolq`, the only miss in the whole corpus -- silently vanished and
          # the run reported a *better* number. Those install from PyPI and are
          # reachable here, so their absence is a command defect, not a runner
          # limitation.
          missing = {e for e in want if e.startswith("inspect_evals/")} - got
          if missing:
              sys.exit(f"the README's command did not reach {sorted(missing)}")

          drift = [e for e in sorted(got & want)
                   if run["per_env"][e]["assay_detected"]
                   != committed["per_env"][e]["assay_detected"]]
          print(f"{len(got)} environments, {len(got & want)} shared, {len(drift)} drifted")
          if drift:
              sys.exit(f"detections drifted on {drift}")

          # Whatever could not be installed has to be *named*, never silent.
          for name, reason in (run.get("unavailable") or {}).items():
              print(f"unavailable on this runner: {name} -- {reason}")
          PY

  results-are-reproducible:
    # The headline table is a committed artifact. If the code no longer produces
    # it, that is a result someone has to look at -- not a number that quietly
    # drifts.
    #
    # Two ecosystems are absent here and the job compares only the environments
    # both runs contain. Docker is unavailable, so `harbor/` is skipped -- which
    # also means the one flake this repo has measured (a sandbox wall-clock
    # timeout under load, read as NONDETERMINISM until it was fixed) cannot
    # occur in CI. And `inspect_evals/` is left out deliberately: it needs the
    # `sweep` extra and pulls datasets over the network, so including it would
    # trade a reproducibility check for a network-flakiness check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev --extra adapters --extra openenv
      - name: Re-run the corpus
        # The corpus executes third-party code and the approval gate fails
        # closed, so an unattended run has to say so out loud. This is the
        # explicit escape, not a default: without it the gate finds no terminal
        # to ask at, refuses, and the job dies rather than quietly running.
        # `assay audit --yes` is the same decision from a command line, and
        # either one is recorded on the Environment Card.
        env:
          ASSAY_APPROVE_ALL: "ci: unattended corpus reproduction, .github/workflows/ci.yml"
        # --allow-reduced is deliberate here: this job compares only the
        # environments both runs contain, which is what the comparison below
        # does, and Docker/openenv/tau2 are not all reachable on a runner.
        run: uv run python scripts/full_run.py --allow-reduced --out /tmp/ci_run.json
      - name: Compare against the committed arms
        run: |
          uv run python - <<'PY'
          import json, sys
          fresh = json.load(open("/tmp/ci_run.json"))
          committed = json.load(open("results/full_run.json"))
          # Harbor is unavailable on this runner, so compare only the
          # environments both runs actually contain.
          shared = set(fresh["per_env"]) & set(committed["per_env"])
          drift = [
              e for e in sorted(shared)
              if fresh["per_env"][e]["assay_detected"]
              != committed["per_env"][e]["assay_detected"]
          ]
          print(f"{len(shared)} shared environments, {len(drift)} drifted")
          if drift:
              for e in drift:
                  print(f"  {e}")
                  print(f"    committed: {sorted(committed['per_env'][e]['assay_detected'])}")
                  print(f"    fresh:     {sorted(fresh['per_env'][e]['assay_detected'])}")
              sys.exit(1)
          PY
