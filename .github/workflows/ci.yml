name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev --extra adapters --extra openenv
      - name: Tests
        # Docker and Ollama are absent here, and that is the point: the suite
        # must skip with a reason rather than fail. Anything that errors is a
        # test that assumed a runtime it never declared.
        run: uv run pytest -q

  results-are-reproducible:
    # The headline table is a committed artifact. If the code no longer produces
    # it, that is a result someone has to look at -- not a number that quietly
    # drifts.
    #
    # Two ecosystems are absent here and the job compares only the environments
    # both runs contain. Docker is unavailable, so `harbor/` is skipped -- which
    # also means the one flake this repo has measured (a sandbox wall-clock
    # timeout under load, read as NONDETERMINISM until it was fixed) cannot
    # occur in CI. And `inspect_evals/` is left out deliberately: it needs the
    # `sweep` extra and pulls datasets over the network, so including it would
    # trade a reproducibility check for a network-flakiness check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev --extra adapters --extra openenv
      - name: Re-run the corpus
        # The corpus executes third-party code and the approval gate fails
        # closed, so an unattended run has to say so out loud. This is the
        # explicit escape, not a default: without it the gate finds no terminal
        # to ask at, refuses, and the job dies rather than quietly running.
        # `assay audit --yes` is the same decision from a command line, and
        # either one is recorded on the Environment Card.
        env:
          ASSAY_APPROVE_ALL: "ci: unattended corpus reproduction, .github/workflows/ci.yml"
        run: uv run python scripts/full_run.py --out /tmp/ci_run.json
      - name: Compare against the committed arms
        run: |
          uv run python - <<'PY'
          import json, sys
          fresh = json.load(open("/tmp/ci_run.json"))
          committed = json.load(open("results/full_run.json"))
          # Harbor is unavailable on this runner, so compare only the
          # environments both runs actually contain.
          shared = set(fresh["per_env"]) & set(committed["per_env"])
          drift = [
              e for e in sorted(shared)
              if fresh["per_env"][e]["assay_detected"]
              != committed["per_env"][e]["assay_detected"]
          ]
          print(f"{len(shared)} shared environments, {len(drift)} drifted")
          if drift:
              for e in drift:
                  print(f"  {e}")
                  print(f"    committed: {sorted(committed['per_env'][e]['assay_detected'])}")
                  print(f"    fresh:     {sorted(fresh['per_env'][e]['assay_detected'])}")
              sys.exit(1)
          PY
