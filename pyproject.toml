[project]
name = "assay"
version = "0.1.0"
description = "An agentic auditor for RL environments and eval suites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# One group per workstream, declared up front so concurrent work never has to
# edit this table. Empty is fine -- an empty group is cheaper than a conflict.
# The `openenv` framework is on PyPI; the environments are not. echo_env and
# textarena_env live only in the huggingface/OpenEnv repo, so they are pinned to
# the revision the audit in docs/changelog/20-openenv.md was run against -- an
# audit of a moving target is not an audit anyone can reproduce.
openenv = [
    "openenv>=0.3.1,<0.4",
    "openenv-echo-env @ git+https://github.com/huggingface/OpenEnv.git@e059726da215f615c44dd10f60402970a3cb20ad#subdirectory=envs/echo_env",
    "openenv-textarena @ git+https://github.com/huggingface/OpenEnv.git@e059726da215f615c44dd10f60402970a3cb20ad#subdirectory=envs/textarena_env",
]
sweep = [
    "inspect_evals~=0.18.0",
]
train = [
    # The trained Challenger is an OPTIONAL artifact. Nothing in `assay` imports
    # any of this at module scope, `uv sync --extra dev --extra adapters` still
    # runs the whole audit, and the scripted Challenger never needs a GPU.
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.15",
    "peft>=0.13",
    "datasets>=2.20",
    "accelerate>=0.34",
    # 4-bit QLoRA only exists on CUDA. Marking it keeps `--extra train`
    # installable on the laptop where the reward tests run.
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
adapters = [
    "inspect-ai>=0.3.260",
]
# tau2-bench is not on PyPI and its own pyproject requires Python 3.13, while
# this repo supports 3.11+. So the package itself is fetched as source by
# scripts/tau2_fetch.py into a gitignored cache, and only the handful of runtime
# dependencies its retail and airline environments actually import are declared
# here. litellm, matplotlib and the rest of tau2's dependency list are for its
# agent runner, which this audit never starts -- no probe here calls a model.
tau2 = [
    "pydantic>=2.7",
    "loguru>=0.7",
    "addict>=2.4",
    "deepdiff>=8.0",
    "python-dotenv>=1.0",
    # tau2 imports `toml` at module scope. It was reaching the venv as a
    # transitive dependency of `inspect_evals`, so this extra worked for anyone
    # who had also installed `--extra sweep` and failed silently for anyone who
    # had not -- which is every reader following the documented command.
    "toml>=0.10",
]
gym = [
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.9.0",
]
# Scoring Assay against BenchGuard's ScienceAgentBench gold set. Only needed to
# read SAB's published metadata off the Hub -- BenchGuard's own matcher and
# metrics run from a checkout of their repo, not from here, which is the point:
# their number is computed by their code.
sab = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "huggingface_hub>=0.23",
]

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# echo_env and textarena_env are only distributed as subdirectories of the
# huggingface/OpenEnv git repository, never as PyPI releases. Auditing them at
# all requires a direct reference.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
