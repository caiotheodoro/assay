[project]
name = "assay"
version = "0.1.0"
description = "An agentic auditor for RL environments and eval suites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# One group per workstream, declared up front so concurrent work never has to
# edit this table. Empty is fine -- an empty group is cheaper than a conflict.
openenv = []
sweep = [
    "inspect_evals~=0.18.0",
]
train = []
adapters = [
    "inspect-ai>=0.3.260",
]

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
